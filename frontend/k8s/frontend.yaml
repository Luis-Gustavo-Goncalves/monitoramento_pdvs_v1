apiVersion: v1
kind: Namespace
metadata:
  name: monitoramento-pdvs
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: monitoramento-pdvs-frontend-nginx
  namespace: monitoramento-pdvs
data:
  default.conf: |
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://monitoramento-pdvs-backend.monitoramento-pdvs.svc.cluster.local:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
        }

        location ~* \.(js|css|png|jpg|ico|svg)$ {
            expires 1d;
            add_header Cache-Control "public";
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoramento-pdvs-frontend
  namespace: monitoramento-pdvs
  labels:
    app: monitoramento-pdvs-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monitoramento-pdvs-frontend
  template:
    metadata:
      labels:
        app: monitoramento-pdvs-frontend
    spec:
      containers:
        - name: frontend
          image: monitoramento-pdvs-frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-config
          configMap:
            name: monitoramento-pdvs-frontend-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: monitoramento-pdvs-frontend
  namespace: monitoramento-pdvs
  labels:
    app: monitoramento-pdvs-frontend
spec:
  type: ClusterIP
  selector:
    app: monitoramento-pdvs-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monitoramento-pdvs-frontend
  namespace: monitoramento-pdvs
spec:
  ingressClassName: nginx
  rules:
    - host: monitoramento-pdvs.lojasrede.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: monitoramento-pdvs-frontend
                port:
                  number: 80
