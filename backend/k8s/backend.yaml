apiVersion: v1
kind: Namespace
metadata:
  name: monitoramento-pdvs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoramento-pdvs-backend
  namespace: monitoramento-pdvs
  labels:
    app: monitoramento-pdvs-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monitoramento-pdvs-backend
  template:
    metadata:
      labels:
        app: monitoramento-pdvs-backend
    spec:
      containers:
        - name: backend
          image: monitoramento-pdvs-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: monitoramento-pdvs-backend
  namespace: monitoramento-pdvs
  labels:
    app: monitoramento-pdvs-backend
spec:
  type: ClusterIP
  selector:
    app: monitoramento-pdvs-backend
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monitoramento-pdvs-backend
  namespace: monitoramento-pdvs
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
    - host: api-monitoramento-pdvs.lojasrede.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: monitoramento-pdvs-backend
                port:
                  number: 8000
